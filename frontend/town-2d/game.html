<!doctype html>
<html lang="zh-CN">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI小镇</title>
    <!-- 从选镇页进来时先垫深色：样式表到了、脚本还没跑的那一下不闪白（gameEntry.ts 垫上画面后撤掉） -->

      html.entering body {
        background: #111412;

      try {
        if (sessionStorage.getItem('town:enter')) document.documentElement.classList.add('entering')
      } catch {}
    </script>
  </head>

    <script type="module" src="/src/gameEntry.ts"></script>
  </body>
