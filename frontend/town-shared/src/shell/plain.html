<!-- 平铺界面（2D 地图）的外壳部件，由 shell/layout.ts 按 data-slot 放进 gameShell.html 的骨架。 -->
<template data-slot="topbar">
  <button id="back-to-maps" class="back-to-maps">← 选择小镇</button>
  <span id="app-title">AI小镇</span>
  <span id="clock">--:--</span>
  <span id="world-facts" class="dim"></span>
  <span id="conn" title="连接中…"
    ><span id="conn-dot"></span><span id="conn-text">连接中…</span></span
  >
  <div id="speeds" role="group" aria-label="世界时间"></div>
  <div id="audio-controls" role="group" aria-label="游戏声音">
    <button id="music-toggle" type="button" aria-pressed="true" aria-label="音乐：开">
      ♫ 音乐：开
    </button>
    <button id="effects-toggle" type="button" aria-pressed="true" aria-label="音效：开">
      ♪ 音效：开
    </button>
  </div>
  <span id="hold-flag" hidden></span>
  <span id="avatar-flag" title="有人在控制化身；这时世界按正常速度走，不自动快进" hidden
    >化身在场</span
  >
  <span class="spacer"></span>
  <button id="open-residents" title="当前居民、村民库与加入小镇">村民</button>
  <button id="open-usage" title="模型请求与 token 消耗">消耗</button>
  <button id="open-settings" title="人设、长相、模型、额度、重置世界">设定</button>
  <button id="open-help" title="开局向导、新手提示和按键说明">帮助</button>
</template>
<!-- 地图左下角的入口：场景物品、书与公告、摆道具，放在地图画面之前 -->
<template data-slot="map"
  ><div class="map-corner">
    <button
      id="open-props"
      class="map-props-button"
      type="button"
      aria-controls="props-view"
      title="查看小镇里的物品、用途和影响"
    >
      场景物品
    </button>
    <button
      id="open-books"
      class="map-props-button"
      type="button"
      aria-controls="books-view"
      title="村民写的书、公告栏上的告示；你也可以写书、贴公告"
    >
      书与公告
    </button>
    <button
      id="open-placing"
      class="map-props-button"
      type="button"
      aria-pressed="false"
      title="在地图上点一个地点，往那里放道具"
    >
      摆道具
    </button>
  </div></template
>
<!-- 右栏是角色卡：在地图上选中村民后点「资料」打开。顶上是像素小人和想法，名字和住处跟在下面；
     正文依次是正在做的事、身体状态、口袋，原因和记录收进「更多细节」；按钮吸底。 -->
<template data-slot="info-panel"
  ><div id="info-head">
    <div class="card-stage">
      <canvas class="card-sprite" width="25" height="34" aria-hidden="true" hidden></canvas>
      <div id="info-thought" hidden></div>
      <div class="card-tools">
        <label class="info-switch"
          >换人 ▾<select aria-label="选择村民" id="resident-select" hidden></select></label
        ><button id="info-collapse" class="card-tool" type="button">收起</button>
      </div>
    </div>
    <div id="info-who">
      <span id="info-name">未选中村民</span>
      <!-- 地点与动作之间不能有空白：「 · 」由样式加在动作前面 -->
      <!-- prettier-ignore -->
      <div id="info-where"><div id="info-place">点击地图上的村民查看信息</div><div id="info-activity"></div></div>
      <div id="info-transit"></div>
      <div id="info-home"></div>
    </div>
  </div>
  <div id="info-body">
    <p id="info-stop" class="info-stop" role="status" hidden>
      <span></span><button type="button" class="link"></button>
    </p>
    <section class="card-section">
      <h3 class="card-caption">正在</h3>
      <div id="info-plan" aria-live="polite">计划数据暂不可用</div>
    </section>
    <section class="card-section">
      <h3 class="card-caption">状态</h3>
      <div id="info-needs"></div>
      <section id="info-physiology"></section>
    </section>
    <section id="info-inventory" class="card-section"></section>
    <details class="card-more">
      <summary>更多细节</summary>
      <div class="info-body-folds"></div>
      <details>
        <summary>目标与记忆</summary>
        <div id="info-agent"></div>
      </details>
    </details>
  </div>
  <div id="info-actions">
    <div class="card-verbs">
      <button id="info-talk" class="card-verb primary" type="button">说话</button>
      <button id="info-follow" class="card-verb" type="button">跟随</button>
      <button id="info-possess" class="card-verb" type="button">附身</button>
    </div>
    <div class="card-links">
      <button id="info-memory" type="button" title="整理过的经历、认识和目标，以及它们的来源">
        回忆
      </button>
      <button id="info-diary" type="button" title="按天看做了什么、想了什么">经历</button>
      <button id="info-chat" type="button" title="参与过的聊天和完整台词">聊过的</button>
      <button id="info-edit" type="button">设定</button>
    </div>
  </div></template
>
